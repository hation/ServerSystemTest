# server-test-kit 配置文件（运行时自动加载，改键即生效，无需重启）
# 格式：key=value，支持行内 # 注释；以 # 开头为注释行，以 [ 开头为节标题行

# ---------- 通用 ----------
# 批次命名前缀：批次名 = 前缀 + 日期时间（如 B20261113_093000），跨批次查询/回溯导入按此前缀识别
BATCH_PREFIX=B

# 并发槽位上限：同时运行的任务/进程数，业务脚本经 Wait-Slot 生效
PARALLEL_MAX=2

# 运行模式：quick=快速检查（默认） / full=完整测试
MODE=quick

# ---------- 默认达标线（示例，请按业务替换；键名通用，值由新项目脚本消费） ----------
# 达标线示例（标注示例）：仅演示"conf 驱动达标线"的工程基因，新项目按业务定义自己的键
THROUGHPUT_MIN=100    # 业务占位：示例达标线，吞吐量下限（MB/s）
IOPS_MIN=1000         # 业务占位：示例达标线，IOPS 下限
TEMPERATURE_MAX=60    # 业务占位：示例达标线，温度上限（℃）

# ---------- 业务扩展（示例，可删） ----------
# EXPECTED_LIST=expect.csv   # 业务占位：预期清单文件（示例）
